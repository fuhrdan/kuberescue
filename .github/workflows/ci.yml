name: CI - Test, Deploy, Self-Heal, Rollout

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python unit and HTTP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile application and scripts
        run: python -m compileall -q app scripts tests
      - name: Run dependency-free test suite
        run: python -m unittest discover -s tests -v

  cluster-integration:
    name: Live kind deployment and recovery test
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start isolated Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kuberescue
          config: k8s/kind-config.yaml
          wait: 120s
      - name: Build v1 image and load onto nodes
        run: |
          docker build --build-arg APP_VERSION=v1 -t kuberescue:v1 .
          kind load docker-image kuberescue:v1 --name kuberescue
      - name: Deploy three replicas
        run: |
          kubectl --context kind-kuberescue apply -f k8s/namespace.yaml
          kubectl --context kind-kuberescue apply -f k8s/deployment.yaml -f k8s/service.yaml
          kubectl --context kind-kuberescue -n kuberescue rollout status deployment/kuberescue --timeout=180s
          kubectl --context kind-kuberescue -n kuberescue get pods -o wide
      - name: Prove self-healing creates a new Pod UID
        run: python scripts/demo_failure.py --timeout 180
      - name: Build and roll out version v2
        run: |
          docker build --build-arg APP_VERSION=v2 -t kuberescue:v2 .
          kind load docker-image kuberescue:v2 --name kuberescue
          kubectl --context kind-kuberescue -n kuberescue set image deployment/kuberescue web=kuberescue:v2
          kubectl --context kind-kuberescue -n kuberescue rollout status deployment/kuberescue --timeout=180s
          test "$(kubectl --context kind-kuberescue -n kuberescue get pods -l app=kuberescue --field-selector=status.phase=Running -o jsonpath='{.items[*].spec.containers[0].image}' | tr ' ' '\n' | grep -cx 'kuberescue:v2')" -eq 3
      - name: Smoke test HTTP response inside cluster
        run: |
          kubectl --context kind-kuberescue -n kuberescue port-forward service/kuberescue 18080:80 > /tmp/kuberescue-port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/api/info > /tmp/kuberescue-response.json
          python -c 'import json; d=json.load(open("/tmp/kuberescue-response.json")); assert d["version"] == "v2", d; print("PASS: v2 Pod responded:", d["pod"])'
      - name: Gather diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-kuberescue -n kuberescue get all -o wide || true
          kubectl --context kind-kuberescue -n kuberescue describe deployment kuberescue || true
          kubectl --context kind-kuberescue -n kuberescue get events --sort-by=.metadata.creationTimestamp || true
